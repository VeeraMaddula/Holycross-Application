name: Scheduled midnight deploy

# Runs once a day at 00:00 GMT (fixed — not adjusted for Irish Summer Time)
# and deploys to Render ONLY if there's a new commit on master since the
# last deploy — pushes during the day just sit on GitHub until this runs.
# Also runnable on demand from the Actions tab ("Run workflow") for
# testing, which always deploys regardless of time.
#
# GitHub Actions cron is always UTC, and UTC == GMT, so a single cron entry
# at 0 0 * * * covers this with no timezone-conversion logic needed. Note
# this means the run time will drift to 1am local Irish time during BST
# (late March–late October), since it's pinned to GMT rather than following
# Dublin's clock changes.
#
# One-time setup required (can't be done from code, see README):
#   1. In Render: Service > Settings > Deploy Hook — copy the URL.
#   2. In Render: Service > Settings > Build & Deploy — turn Auto-Deploy OFF
#      (otherwise Render deploys on every push, defeating the "only at
#      midnight" part of this).
#   3. In GitHub: Repo Settings > Secrets and variables > Actions > New
#      repository secret — name it RENDER_DEPLOY_HOOK_URL, paste the URL
#      from step 1.

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy-if-changed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare current commit to the last one we deployed
        id: check
        run: |
          CURRENT_SHA="${{ github.sha }}"
          LAST_SHA=$(cat .github/last-deployed-sha 2>/dev/null || echo "none")
          echo "Current commit on master: $CURRENT_SHA"
          echo "Last commit we deployed:  $LAST_SHA"
          if [ "$CURRENT_SHA" = "$LAST_SHA" ]; then
            echo "No new commits since the last deploy — nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits found."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Render deploy
        if: steps.check.outputs.changed == 'true'
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deploy triggered."

      - name: Record this commit as deployed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "${{ github.sha }}" > .github/last-deployed-sha
          git add .github/last-deployed-sha
          git commit -m "chore: record midnight deploy of ${GITHUB_SHA::7}"
          git push
