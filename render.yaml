# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then on Render choose
# New > Blueprint and point it at this repo. Render reads this file and
# creates the service below automatically. Any env var marked
# `sync: false` needs its real value entered once in the Render dashboard
# after the first deploy (Render will prompt for these) — nothing secret
# lives in this file or in git.
#
# The persistent disk is mounted at /var/data and PERSIST_DIR points the
# app at it (see src/persist.js) — without this, Render wipes local disk on
# every deploy/restart and you'd lose data/db.json, staff avatars, kiosk
# selfies, and report attachments each time.
services:
  - type: web
    name: holycross-booking
    runtime: node
    plan: starter
    # Installs the OpenArt CLI binary (to /usr/local/bin, its own default —
    # no --prefix, so there's no ambiguity about the exact install layout)
    # alongside the normal npm install. See src/openArt.js for why this
    # exists: OpenArt has no API-key system, only this CLI or their MCP
    # server (built for AI agents, not a plain backend). Render's native
    # Node runtime builds and starts in the same container, so a binary
    # installed here is still on PATH when the app starts.
    buildCommand: npm install && curl -fsSL https://raw.githubusercontent.com/OpenArt-AI/cli/main/install.sh | sh
    startCommand: npm start
    healthCheckPath: /login
    disk:
      name: holycross-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PERSIST_DIR
        value: /var/data
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_SHIFTS
        sync: false
      - key: SMTP_FROM_REQUESTS
        sync: false
      - key: SMTP_FROM_REPORTS
        sync: false
      - key: SMTP_FROM_PASSWORD_RESET
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: SENDMODE_API_KEY
        sync: false
      - key: SENDMODE_SENDER_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_KEY_PATH
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: APP_TIMEZONE
        value: Europe/Dublin
      # One-time setup: run `openart login` on a machine with a browser (see
      # src/openArt.js), then paste the full contents of the resulting
      # credentials file (~/.openart/cli-credentials.json, or
      # %USERPROFILE%\.openart\cli-credentials.json on Windows) as this
      # value in the Render dashboard. The app seeds it onto the persistent
      # disk on first boot; after that the CLI refreshes it on its own, so
      # this only ever needs to be set once.
      - key: OPENART_CLI_CREDENTIALS_JSON
        sync: false
      # The install script falls back to ~/.local/bin when /usr/local/bin
      # isn't writable (confirmed on Render: it lands at
      # /opt/render/.local/bin), which isn't on PATH for the running
      # service — so src/openArt.js needs the exact path rather than relying
      # on PATH to find it.
      - key: OPENART_CLI_PATH
        value: /opt/render/.local/bin/openart
